name: ci

on:
  push:
    branches:
      - 'main'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}


jobs:
  test:
    uses: ./.github/workflows/test.yml

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      -
        name: Checkout
        uses: actions/checkout@v2
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v3.4.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=tag
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1.5.1
      -
        name: Build and push
        uses: docker/build-push-action@v2.6.1
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Opens (or updates) a PR in kubernetes/k8s.io that points elections.k8s.io at this commit's
  # image. An OWNER of kubernetes/gke-aaa/elekto still approves it; ArgoCD deploys on merge.
  # Steps live in `make deploy` (see Makefile); this job only sets up the bot's identity.
  bump-k8s-io:
    needs: docker-build
    if: github.repository == 'elekto-dev/elekto'
    runs-on: ubuntu-latest
    concurrency: bump-k8s-io
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.K8S_IO_BUMP_TOKEN }}
      SIGNING_KEY: ${{ secrets.K8S_IO_BUMP_SIGNING_KEY }}
      K8S_IO_FORK: ${{ vars.K8S_IO_FORK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.GH_TOKEN != '' && env.K8S_IO_FORK != ''
      - name: Open or update the k8s.io PR
        if: env.GH_TOKEN != '' && env.K8S_IO_FORK != ''
        run: |
          gh auth setup-git
          login=$(gh api user -q .login)
          git config --global user.name "$login"
          git config --global user.email "$(gh api user -q .id)+$login@users.noreply.github.com"
          if [ -n "$SIGNING_KEY" ]; then
            install -m 600 /dev/null "$RUNNER_TEMP/signing_key"
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing_key"
            git config --global gpg.format ssh
            git config --global user.signingkey "$RUNNER_TEMP/signing_key"
            git config --global commit.gpgsign true
          fi
          make deploy SHA="$GITHUB_SHA" BUILD_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
