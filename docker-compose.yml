services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_DB: elekto
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d elekto']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5000
      DB_CONNECTION: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: elekto
      DB_USERNAME: root
      DB_PASSWORD: root
      META_PATH: /tmp/meta
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
